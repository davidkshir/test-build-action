
name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot
        shell: bash
        run: |
          echo "Downloading Godot"

          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"

          echo "Godot successfully downloaded"

      - name: Extract Godot
        shell: bash
        run: |
          echo "Extracting Godot"

          unzip godot.zip

          echo "Godot successfully extracted"

      - name: Configure Godot executable
        shell: bash
        run: |
          echo "Configuring Godot executable"

          GODOT_PATH="$PWD/Godot.app/Contents/MacOS/Godot"
          test -f "$GODOT_PATH"
          echo "GODOT=$GODOT_PATH" >> "$GITHUB_ENV"

          echo "Godot executable configured"

      - name: Download Godot Export Templates
        shell: bash
        run: |
          echo "Downloading Godot export templates"

          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"

          echo "Export templates successfully downloaded"

      - name: Extract Godot Export Templates
        shell: bash
        run: |
          echo "Extracting export templates"

          unzip templates.tpz -d godot_templates

          echo "Export templates successfully extracted"

      - name: Install Godot Export Templates
        shell: bash
        run: |
          echo "Installing Godot export templates"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv godot_templates/templates/* "$TEMPLATE_DIR/"

          echo "Export templates successfully installed"

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Original import step, currently disabled.
      # ==========================================================

      # - name: Import Godot Project
      #   shell: bash
      #   run: |
      #     echo "Importing Godot project"
      #
      #     "$GODOT" --headless --path . --editor --import --quit
      #
      #     echo "Godot project successfully imported"

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Runs Godot under LLDB to capture crash information.
      # Replace this with the original import step afterward.
      # ==========================================================

      - name: Debug Godot Import
        shell: bash
        run: |
          echo "Starting Godot under LLDB"

          lldb --batch \
            -o run \
            -o "thread backtrace all" \
            -o "register read" \
            -- "$GODOT" --headless --rendering-method gl_compatibility --path . --editor --import --quit

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Searches for macOS crash reports generated by Godot.
      # ==========================================================

      - name: Collect macOS Crash Reports
        if: always()
        shell: bash
        run: |
          echo "Checking macOS crash reports"

          ls -lah "$HOME/Library/Logs/DiagnosticReports/" || true

          find "$HOME/Library/Logs/DiagnosticReports/" \
            -type f \
            \( -name "*Godot*.ips" -o -name "*Godot*.crash" \) \
            -print || true

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Inspects the actual iOS export preset.
      #
      # This will tell us:
      # 1. Whether the iOS preset exists.
      # 2. Whether the Team ID setting exists.
      # 3. Whether the Team ID is empty.
      # 4. Whether the export method is Development or App Store.
      # 5. Whether our old placeholder was ever applied.
      #
      # IMPORTANT: This step does NOT modify the configuration.
      # ==========================================================

      - name: Debug iOS Export Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========== EXPORT PRESET FILE =========="

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg does not exist!"
            exit 1
          fi

          ls -lah export_presets.cfg

          echo "========== INSPECT EXPORT SETTINGS =========="

          python3 - <<'PY'
          from pathlib import Path
          import configparser

          path = Path("export_presets.cfg")
          data = path.read_text()

          parser = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          parser.optionxform = str
          parser.read_string(data)

          for section in parser.sections():
              print(f"\n[{section}]")

              for key, value in parser.items(section):
                  if (
                      "team" in key.lower()
                      or "sign" in key.lower()
                      or "export_method" in key.lower()
                      or "bundle_identifier" in key.lower()
                      or key in ("name", "platform")
                  ):
                      print(f"{key} = {value}")

          print("\n========== TEAM ID CHECK ==========")

          found = False

          for section in parser.sections():
              for key, value in parser.items(section):
                  if "team" in key.lower():
                      found = True
                      print(f"FOUND: [{section}] {key} = {value}")

          if not found:
              print("WARNING: No Team ID setting found!")

          print("\n========== PREVIOUS FIX CHECK ==========")

          old = 'application/app_store_team_id=""'

          print("Old empty setting exists:", old in data)
          print("Placeholder exists:", "AAAAAAAAAA" in data)

          print("\n========== END CONFIGURATION DEBUG ==========")
          PY

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Runs the iOS export with verbose logging.
      #
      # This temporarily replaces the normal export step.
      # It prints additional Godot output and captures the
      # export exit code.
      #
      # When debugging is finished, delete this step and
      # uncomment the original export step below.
      # ==========================================================

      - name: Debug iOS Export
        shell: bash
        run: |
          set -uo pipefail

          echo "========== GODOT VERSION =========="
          "$GODOT" --version

          echo "========== EXPORT SETTINGS =========="

          grep -nE '^\[preset|^name=|^platform=|team_id|export_method|bundle_identifier' \
            export_presets.cfg || true

          echo "========== POCKETAR VERIFICATION =========="

          if [ -f addons/pocketar/pocketar.gdextension ]; then
            echo "PocketAR GDExtension found"
          else
            echo "WARNING: PocketAR GDExtension missing!"
          fi

          if [ -d addons/pocketar/bin/ios/template_release/pocketar.xcframework ]; then
            echo "PocketAR iOS framework found"
          else
            echo "WARNING: PocketAR iOS framework missing!"
          fi

          echo "========== STARTING GODOT EXPORT =========="

          mkdir -p build

          set +e

          "$GODOT" --headless --verbose --path . \
            --export-release "iOS" \
            build/RetroPong3D.zip \
            2>&1 | tee build/export-debug.log

          EXIT_CODE=${PIPESTATUS[0]}

          set -e

          echo "========== EXPORT EXIT CODE =========="
          echo "$EXIT_CODE"

          echo "========== EXPORT ERRORS =========="

          grep -inE 'error|warning|failed|team|sign' \
            build/export-debug.log | tail -n 100 || true

          echo "========== GENERATED FILES =========="

          find build -maxdepth 3 -print

          echo "========== END EXPORT DEBUG =========="

          exit "$EXIT_CODE"

      # ==========================================================
      # TEMPORARY DEBUGGING - DELETE LATER
      # Original iOS export step, temporarily disabled.
      #
      # Restore this after removing the Debug iOS Export step.
      # ==========================================================

      # - name: Export iOS Project
      #   shell: bash
      #   run: |
      #     echo "Exporting Godot project for iOS"
      #
      #     mkdir -p build
      #     "$GODOT" --headless --path . --export-release "iOS" build/RetroPong3D.zip
      #
      #     echo "iOS project successfully exported"

      # ==========================================================
      # NORMAL BUILD STEPS
      # These are NOT temporary debugging steps.
      # ==========================================================

      - name: Extract iOS Xcode Project
        shell: bash
        run: |
          echo "Extracting exported Xcode project"

          test -f build/RetroPong3D.zip

          unzip -q build/RetroPong3D.zip -d build/ios_export

          echo "Searching for Xcode project"

          find build/ios_export -name "*.xcodeproj" -type d -print

          PROJECT=$(find build/ios_export -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found!"
            exit 1
          fi

          echo "XCODE_PROJECT=$PWD/$PROJECT" >> "$GITHUB_ENV"

          echo "Xcode project found: $PROJECT"

      - name: Build iOS Application
        shell: bash
        run: |
          echo "Building iOS application"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme RetroPong3D \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          echo "iOS application successfully built"

      - name: Package IPA
        shell: bash
        run: |
          echo "Packaging iOS application"

          APP=$(find build/DerivedData/Build/Products \
            -maxdepth 2 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No compiled .app found!"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          cd build
          zip -qry RetroPong3D-unsigned.ipa Payload

          echo "IPA successfully packaged"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroPong3D-iOS
          path: build/RetroPong3D-unsigned.ipa
          if-no-files-found: error
